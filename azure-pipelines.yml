trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'cyberlabacr'
  imageRepository: 'cyberlab'
  containerRegistry: 'cyberlabacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  REGISTRY_USERNAME: 'cyberlabacr'
  REGISTRY_PASSWORD: '9PVcAQlpU63aw116f8eV5sYAiZc5JbAoipS5kDOVWnkd7kYLoseAJQQJ99CIACYeBjFEqg7NAAACAZCRi4iB'

stages:
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: BuildImage
    displayName: Build Docker Image
    steps:
    - task: Docker@2
      displayName: Build and push image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Container Instance
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployContainer
    displayName: Deploy CyberBeacon
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: Deploy Container to ACI
            inputs:
              azureSubscription: 'CyberPathways'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Delete old container if exists
                az container delete --resource-group cyberpathways-rg --name cyberbeacon --yes 2>/dev/null || true

                # Create new container with latest image
                az container create \
                  --resource-group cyberpathways-rg \
                  --name cyberbeacon \
                  --image $(containerRegistry)/$(imageRepository):latest \
                  --os-type Linux \
                  --cpu 2 \
                  --memory 4 \
                  --registry-username $(REGISTRY_USERNAME) \
                  --registry-password $(REGISTRY_PASSWORD) \
                  --environment-variables OLLAMA_HOST="http://ollama-service.eastus.azurecontainer.io:11434" \
                  --ports 3000 3001 \
                  --ip-address Public \
                  --dns-name-label cyberbeacon-jumpstart

                # Wait for container to start
                sleep 30

                # Check status
                az container show --resource-group cyberpathways-rg --name cyberbeacon --query "{Name:name, State:containers[0].instanceView.currentState.state, IP:ipAddress.ip}" -o json
