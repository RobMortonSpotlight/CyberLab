# DNS Configuration for CyberLab
# Provides DNS resolution and DHCP services

listen-address=0.0.0.0
port=53
bind-interfaces

# DNS Records for Lab Systems
address=/firewall.cyberlab.local/192.168.1.1
address=/linux-server.cyberlab.local/192.168.1.10
address=/ws-employee.cyberlab.local/192.168.1.20
address=/server.cyberlab.local/192.168.1.30
address=/iot-device.cyberlab.local/192.168.1.50

# Additional DNS entries for learning scenarios
address=/internal-db.cyberlab.local/192.168.1.30
address=/admin.cyberlab.local/192.168.1.30
address=/file-share.cyberlab.local/192.168.1.30
address=/backup-service.cyberlab.local/192.168.1.30

# Log queries
log-queries
log-facility=/var/log/dnsmasq.log

# Cache DNS responses
cache-size=150

# Standard queries
no-hosts

# Optional: Restrict queries to localhost only (for security)
# restrict-interface=lo
