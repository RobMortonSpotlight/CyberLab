# Samba Configuration for CyberLab Windows File Server
# Intentionally configured with security weaknesses for learning

[global]
    # Server configuration
    workgroup = CYBERLAB
    server string = CyberLab File Server (%h)
    netbios name = SERVER
    hostname lookups = yes

    # Finding 03: Service Banner Disclosure
    # Verbose version information
    server role = standalone server

    # Network settings
    interfaces = 0.0.0.0/0
    bind interfaces only = no

    # Security (Intentionally weak - Finding 13)
    security = user
    map to guest = bad user

    # Finding 11: NTLM Authentication Exposure
    ntlm auth = yes
    ntlmv2-only = no
    lanman auth = yes

    # Finding 09: SMB Information Exposure
    os level = 65
    preferred master = yes
    local master = yes
    domain master = yes

    # Logging
    logging = file
    log file = /var/log/cyberlab/file-server.log
    max log size = 50000

    # Allow null sessions
    restrict anonymous = 0

    # Performance
    server max protocol = SMB3

# ============================================================================
# DATA SHARE - Finding 10: Overly Permissive Access
# Contains deployment information, credentials, network documentation
# ============================================================================
[data]
    comment = Shared Data and Documentation
    path = /var/samba-shares/data
    browseable = yes
    writable = yes
    guest ok = no
    valid users = admin dataadmin employee
    force create mode = 0666
    force directory mode = 0777
    create mask = 0777
    directory mask = 0777

# ============================================================================
# BACKUP SHARE - Finding 14: Exposed Management Interface
# Contains backup files with sensitive information
# ============================================================================
[backup]
    comment = System Backups
    path = /var/samba-shares/backup
    browseable = yes
    writable = yes
    guest ok = no
    valid users = admin dataadmin
    create mask = 0666
    directory mask = 0777

# ============================================================================
# ADMIN SHARE - Internal Administrative Access
# ============================================================================
[admin]
    comment = Administrator Share
    path = /var/samba-shares/admin
    browseable = no
    writable = no
    guest ok = no
    valid users = admin
    read only = yes

# ============================================================================
# PUBLIC SHARE - Unnecessary (Finding 02: Excessive Service Exposure)
# ============================================================================
[public]
    comment = Public Documents
    path = /var/samba-shares/public
    public = yes
    browseable = yes
    writable = yes
    guest ok = yes
    create mask = 0777
    directory mask = 0777

# Print shares (Unnecessary - Finding 02)
[printers]
    comment = All Printers
    path = /var/spool/samba
    printable = yes
    browseable = yes
    public = yes
    guest ok = yes

[print$]
    comment = Printer Drivers
    path = /var/lib/samba/printers
    browseable = yes
    read only = yes
    guest ok = no
