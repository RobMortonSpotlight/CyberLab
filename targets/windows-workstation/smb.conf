# Samba Configuration for CyberLab Windows Workstation Simulation
# Intentionally configured with security weaknesses for learning

[global]
    # Basic server configuration
    workgroup = CYBERLAB
    server string = CyberLab Workstation (%h)
    hostname lookups = yes

    # Network settings
    interfaces = 0.0.0.0/0
    bind interfaces only = no

    # Finding 03: Verbose service banners
    server role = standalone server
    netbios name = WS-EMPLOYEE

    # Security settings (Intentionally weak - Finding 13: Excessive Privileges)
    security = user
    map to guest = bad user
    guest account = nobody

    # Authentication
    ntlm auth = yes
    ntlmv2-only = no

    # Finding 09: SMB Information Exposure
    # Detailed server information disclosure
    os level = 65
    preferred master = yes
    local master = yes
    domain master = yes

    # Logging for analysis
    logging = file
    log file = /var/log/cyberlab/samba.log
    max log size = 50000

    # Finding 11: NTLM Authentication Exposure
    # Allow capture of NTLM authentication
    lanman auth = yes
    client ntlmv2 auth = no

    # Printer sharing (unnecessary - Finding 02)
    load printers = yes
    printing = cups

    # Performance settings that leak information
    server max protocol = SMB3

    # Allow null sessions (Information disclosure)
    null passwords = yes
    restrict anonymous = 0

# ============================================================================
# PUBLIC SHARE - Finding 02: Excessive Service Exposure
# ============================================================================
[public]
    comment = Public Share
    path = /var/samba-shares/public
    public = yes
    writable = yes
    browseable = yes
    guest ok = yes
    force create mode = 0644
    force directory mode = 0755
    create mask = 0777
    directory mask = 0777

# ============================================================================
# DATA SHARE - Finding 10: Overly Permissive SMB Share
# Contains intentional information leakage
# ============================================================================
[data]
    comment = User Data Share
    path = /var/samba-shares/data
    browseable = yes
    writable = yes
    valid users = @CYBERLAB
    guest ok = no
    create mask = 0777
    directory mask = 0777

    # Intentionally open permissions (Finding 10)
    force create mode = 0666
    force directory mode = 0777

# ============================================================================
# ADMIN SHARE - Finding 14: Exposed Management Interface
# ============================================================================
[admin]
    comment = Administrative Share
    path = /var/samba-shares/admin
    browseable = no
    writable = no
    guest ok = no
    valid users = admin dataadmin
    read only = yes

# ============================================================================
# PRINTER SHARE - Unnecessary Service (Finding 02)
# ============================================================================
[printers]
    comment = All Printers
    path = /var/spool/samba
    public = yes
    browseable = yes
    printable = yes
    guest ok = yes

# Print drivers
[print$]
    comment = Printer Drivers
    path = /var/lib/samba/printers
    browseable = yes
    read only = yes
    guest ok = no
