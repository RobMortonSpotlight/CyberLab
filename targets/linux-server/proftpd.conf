# ProFTPD Configuration for CyberLab
# Intentionally configured to demonstrate security weaknesses

ServerName                  "CyberLab FTP Server"
ServerType                  standalone
Port                        21
Umask                       022

# Security: Show detailed version info (Finding 03 - Service Banner Disclosure)
# This allows students to research the vulnerable version
ServerIdent                 on "FTP Server ProFTPD 1.3.5 (Linux)"

# Verbose logging for analysis
TransferLog                 /var/log/cyberlab/proftpd-transfer.log
ExtendedLog                 /var/log/cyberlab/proftpd-access.log WRITE,READ default
ExtendedLog                 /var/log/cyberlab/proftpd-auth.log AUTH default

# Allow root login (Intentional weakness - Finding 13: Excessive Privileges)
RootLogin                   on

# Accept non-fully-qualified hostnames (Intentional weakness)
AllowForeignAddress         on

# Maximum login attempts (Weak - allows brute force)
MaxLoginAttempts            10

# Intentionally Vulnerable ProFTPD Copy/Paste Command (Finding 05)
# ProFTPD 1.3.5 has a vulnerability in handling specific commands
# Students should discover this through version research
# The actual exploitation is controlled by ProFTPD source code version

# Directory configurations
<Directory />
  <Limit ALL>
    AllowAll
  </Limit>
</Directory>

# Public FTP directory (Learning scenario)
<Directory /var/ftp/pub>
  <Limit ALL>
    AllowAll
  </Limit>
</Directory>

# Admin directory with weak permissions (Finding 02: Excessive Service Exposure)
# This directory exposes internal documentation
<Directory /var/ftp/admin>
  <Limit LIST READ RETR>
    AllowUser anonymous admin
  </Limit>
  <Limit CWD>
    AllowAll
  </Limit>
</Directory>

# Database backup directory (Information disclosure)
<Directory /var/ftp/backup>
  <Limit LIST READ RETR>
    AllowAll
  </Limit>
</Directory>

# Anonymous access configuration
<Anonymous ~ftp>
  User                ftp
  Group               nogroup
  UserAlias           anonymous ftp

  # Intentionally permissive (Finding 02)
  <Limit LOGIN>
    AllowAll
  </Limit>

  # Allow file access
  <Limit ALL>
    AllowAll
  </Limit>
</Anonymous>

# User account access
<Limit USER PASS QUIT>
  AllowAll
</Limit>

# Data connection port range (Intentionally exposed)
PassivePorts                20000 20100

# Allow specific commands for exploitation scenarios
<Limit SITE CHMOD>
  AllowAll
</Limit>

# Intentional misconfiguration: Allow reading outside home directory
<Limit RETR CWD>
  AllowAll
</Limit>

# No chroot jail (Significant security weakness - Finding 13)
DefaultRoot ~

# Authentication methods (Weak configuration)
DefaultAuthenticate         on
RequireValidShell           off

# Log malformed commands for analysis
LogFormat                   default "%h %l %u %t \"%r\" %s %b"
